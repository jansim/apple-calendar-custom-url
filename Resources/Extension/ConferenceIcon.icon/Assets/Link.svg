<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="-20 -20 40 40">
  <!-- The chain link from the app icon: two open pills, each hooking its inner
       end into the other. The second is the first turned 180°. Gaps between
       strokes are kept at least half a stroke wide so nothing crowds. -->
  <g fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" transform="rotate(-45)">
    <path d="M -5.1 4 H -8.2 A 4 4 0 0 1 -8.2 -4 H -2 A 4 4 0 0 1 2 0"/>
    <path d="M 5.1 -4 H 8.2 A 4 4 0 0 1 8.2 4 H 2 A 4 4 0 0 1 -2 0"/>
  </g>
</svg>
